plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.0.3')

    constraints {
        api 'org.jobrunr:jobrunr-spring-boot-4-starter:8.5.0'
    }
}


configure(subprojects.findAll {it.name != 'platform'}) {

    apply plugin: 'java'
    apply plugin: 'idea'
    group = 'org.jobrunr.examples'
    version = '1.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

